# Lock-down checks for every push and pull request.
# 1. Compile every registered statement against the pinned Mathlib.
# 2. Run the registry checker: no sorry, no native_decide, only the three
#    standard axioms; record the definition chain.
# 3. Independently re-verify the .olean files with lean4checker.
name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install elan
        run: |
          curl -sSfL https://github.com/leanprover/elan/releases/latest/download/elan-x86_64-unknown-linux-gnu.tar.gz | tar xz
          ./elan-init -y --no-modify-path --default-toolchain "$(cat lean-toolchain)"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Get Mathlib cache
        run: lake exe cache get

      - name: Build statements and checker
        run: lake build Conjectures check

      - name: Registry checks (sorry / native_decide / axioms / definition chain)
        run: scripts/run_checks.sh

      - name: Independent kernel re-check (lean4checker)
        run: scripts/lean4checker.sh

      - name: Validate metadata
        run: python3 scripts/validate_meta.py

      - name: Upload check reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: check-reports
          path: build/check/
