# Lock-down checks for every push and pull request.
# 1. Compile every registered statement against the pinned Mathlib.
# 2. Run the registry checker: no sorry, no native_decide, only the three
#    standard axioms; record the definition chain.
# 3. Independently re-verify the .olean files with lean4checker.
name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Lean 规范对抗测试
        run: python3 tests/test_lean_policy.py
      - name: 编辑应用测试
        run: bash tests/test_apply_edit.sh
      - name: 网站显示与网址名测试
        run: python3 tests/test_site.py
      - name: 编辑网关（Worker）测试
        run: node worker/test.mjs "$RUNNER_TEMP/issue.md"
      - name: 表述文件规范
        run: python3 scripts/lean_policy.py Conjectures/*/*.lean

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install elan
        run: |
          curl -sSfL https://github.com/leanprover/elan/releases/latest/download/elan-x86_64-unknown-linux-gnu.tar.gz | tar xz
          ./elan-init -y --no-modify-path --default-toolchain "$(cat lean-toolchain)"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Get Mathlib cache
        run: lake exe cache get

      - name: Build statements and checker
        run: lake build Conjectures check

      - name: Registry checks (sorry / native_decide / axioms / definition chain)
        run: scripts/run_checks.sh

      - name: Independent kernel re-check (lean4checker)
        run: scripts/lean4checker.sh

      - name: Validate metadata
        run: python3 scripts/validate_meta.py

      - name: Upload check reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: check-reports
          path: build/check/

  # 证明验证流程：一份正确的证明必须通过，几种作弊的证明必须被拒
  proof-pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install elan
        run: |
          curl -sSfL https://github.com/leanprover/elan/releases/latest/download/elan-x86_64-unknown-linux-gnu.tar.gz | tar xz
          ./elan-init -y --no-modify-path --default-toolchain "$(cat lean-toolchain)"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Get Mathlib cache
        run: lake exe cache get
      - name: Proof pipeline tests
        run: bash tests/test_proof_pipeline.sh
