# Model-assisted patrol for Lean-level problems in registered statements.
# Runs weekly and on demand. Needs repository secrets QWEN_API_KEY and
# GEMINI_API_KEY. Opens issues per patrol/patrol.py's combination rule.
name: Patrol
on:
  schedule:
    - cron: "17 3 * * 1"   # Mondays 03:17 UTC
  workflow_dispatch:
    inputs:
      only:
        description: "Only this statement id (e.g. 20261014-01)"
        required: false

permissions:
  contents: read
  issues: write

jobs:
  patrol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install elan
        run: |
          curl -sSfL https://github.com/leanprover/elan/releases/latest/download/elan-x86_64-unknown-linux-gnu.tar.gz | tar xz
          ./elan-init -y --no-modify-path --default-toolchain "$(cat lean-toolchain)"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Get Mathlib cache
        run: lake exe cache get

      - name: Produce fresh CI evidence (checker reports)
        run: scripts/run_checks.sh || true   # a failing entry is evidence, not a reason to stop

      - name: Run patrol
        env:
          QWEN_API_KEY: ${{ secrets.QWEN_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          QWEN_MODEL: ${{ vars.QWEN_MODEL }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          QWEN_BASE_URL: ${{ vars.QWEN_BASE_URL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          if [ -n "${{ inputs.only }}" ]; then
            python3 patrol/patrol.py --only "${{ inputs.only }}"
          else
            python3 patrol/patrol.py
          fi
