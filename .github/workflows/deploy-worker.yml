# 把 worker/ 部署到 Cloudflare（编辑网关 + 灌水区）。手动运行，或 worker/ 有改动合并到 main 后自动运行。
#
# 一次性准备（全部在 GitHub 仓库 Settings → Secrets and variables → Actions 里填）：
#   Secrets：CLOUDFLARE_API_TOKEN、CLOUDFLARE_ACCOUNT_ID、ANON_SECRET、CHAT_ADMIN_TOKEN
#            开通网页编辑再加：EDIT_GITHUB_TOKEN；人机验证可选：TURNSTILE_SECRET
#            “问 AI”：DEEPINFRA_API_KEY 和/或 GEMINI_API_KEY（两个都填时先用 DeepInfra）
#   Variables：可选 TURNSTILE_SITEKEY、GEMINI_MODEL、DEEPINFRA_MODEL（KV 编号已写在 worker/wrangler.toml 里）
# 步骤见 docs/WEB_EDIT.md。
name: Deploy Worker
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["worker/**"]

permissions:
  contents: read

concurrency:
  group: deploy-worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 检查必填项
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ANON_SECRET: ${{ secrets.ANON_SECRET }}
        run: |
          missing=""
          for v in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID ANON_SECRET; do
            [ -n "${!v}" ] || missing="$missing $v"
          done
          if [ -n "$missing" ]; then echo "::error::还没有填：$missing（见 docs/WEB_EDIT.md）"; exit 1; fi
          if [ ${#ANON_SECRET} -lt 16 ]; then echo "::error::ANON_SECRET 至少要 16 个字符"; exit 1; fi
      - name: 填入站点密钥（以及可选的 KV 编号覆盖）
        env:
          KV_NAMESPACE_ID: ${{ vars.KV_NAMESPACE_ID || secrets.KV_NAMESPACE_ID }}
          TURNSTILE_SITEKEY: ${{ vars.TURNSTILE_SITEKEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          DEEPINFRA_MODEL: ${{ vars.DEEPINFRA_MODEL }}
        run: |
          python3 - <<'PY'
          import os, re
          p = "worker/wrangler.toml"; s = open(p, encoding="utf-8").read()
          kv = os.environ.get("KV_NAMESPACE_ID", "").strip()
          if kv:
              if not re.fullmatch(r"[0-9a-f]{32}", kv): raise SystemExit("KV_NAMESPACE_ID 应该是 32 位十六进制编号")
              s = re.sub(r'(?m)^id = "[^"]*"(.*)$', f'id = "{kv}"', s)
          site = os.environ.get("TURNSTILE_SITEKEY", "").strip()
          s = re.sub(r'(?m)^TURNSTILE_SITEKEY = ""(.*)$', f'TURNSTILE_SITEKEY = "{site}"', s)
          def model_var(name, pattern, example):
              # 变量值误写成“名字 = 值”时只取值
              v = re.sub(rf"^{name}\s*=\s*", "", os.environ.get(name, "").strip()).strip().strip('"')
              if v and not re.fullmatch(pattern, v): raise SystemExit(f"{name} 只能是模型名，例如 {example}")
              return re.sub(rf'(?m)^{name} = ""(.*)$', f'{name} = "{v}"', s)
          s = model_var("GEMINI_MODEL", r"[A-Za-z0-9.\-]+", "gemini-3.8-flash")
          s = model_var("DEEPINFRA_MODEL", r"[A-Za-z0-9._\-]+/[A-Za-z0-9._\-]+", "Qwen/Qwen3.8-Flash")
          open(p, "w", encoding="utf-8").write(s)
          PY
      - name: 安装 wrangler
        working-directory: worker
        run: npm install --no-audit --no-fund --no-save wrangler@4
      - name: 部署
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
      - name: 上传密钥（没填的跳过）
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          S_ANON_SECRET: ${{ secrets.ANON_SECRET }}
          S_CHAT_ADMIN_TOKEN: ${{ secrets.CHAT_ADMIN_TOKEN }}
          S_GITHUB_TOKEN: ${{ secrets.EDIT_GITHUB_TOKEN }}
          S_TURNSTILE_SECRET: ${{ secrets.TURNSTILE_SECRET }}
          S_GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          S_DEEPINFRA_API_KEY: ${{ secrets.DEEPINFRA_API_KEY }}
        run: |
          for name in ANON_SECRET CHAT_ADMIN_TOKEN GITHUB_TOKEN TURNSTILE_SECRET GEMINI_API_KEY DEEPINFRA_API_KEY; do
            var="S_$name"; val="${!var}"
            if [ -n "$val" ]; then printf '%s' "$val" | npx wrangler secret put "$name" > /dev/null && echo "已上传 $name"; else echo "跳过 $name（未填）"; fi
          done
      - name: 确认
        run: |
          sleep 10
          if curl -fsS https://formalnaturalist.co.nz/api/config; then echo; echo "部署完成：https://formalnaturalist.co.nz/chat/"
          else echo "::warning::部署已完成，但路由可能还在生效中，几分钟后打开 https://formalnaturalist.co.nz/chat/ 看看"; fi
