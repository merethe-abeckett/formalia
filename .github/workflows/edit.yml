# 处理编辑：网站表单（经 Cloudflare Worker 以仓库所有者身份开议题）和 GitHub 声明表单（任何人）。
# 维基式：检查通过就直接写入 main，不需要人工批准；每条编辑都留议题和提交记录，可回退。
#
# 安全设计：
#   check  任务编译不可信的 Lean 代码 → 没有任何密钥，令牌只读
#   声明证明时多两步（都没有密钥、只读）：
#     proof-build 编译提交的证明（完整 Lean，编译时可执行任意代码，产物不被信任）
#     proof-check 在全新工作区里重新编译登记库自己的表述和验证器，只取证明的 .olean 检查
#   commit 任务持有写权限 → 不编译 Lean，只重新运行确定性的 apply_edit.py 和校验
#   用户提交的文字从不插进 run: 脚本，只经环境变量和文件传递
name: Edit
on:
  issues:
    types: [opened]

permissions: {}

# 不用 concurrency：GitHub 的并发组只保留一个排队中的运行，会静默取消多出来的编辑。
# 并发写入由 commit 任务里的“在最新 main 上重新应用再推送”循环处理。

jobs:
  check:
    if: >-
      (github.event.issue.user.login == github.repository_owner &&
       contains(github.event.issue.body, '<!-- formalia-edit v1 -->')) ||
      contains(github.event.issue.labels.*.name, 'claim')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      ok: ${{ steps.check.outputs.ok }}
      needs_lean: ${{ steps.check.outputs.needs_lean }}
      needs_proof: ${{ steps.check.outputs.needs_proof }}
      target: ${{ steps.check.outputs.target }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - id: check
        name: 检查编辑
        env:
          BODY: ${{ github.event.issue.body }}
          ISSUE: ${{ github.event.issue.number }}
          CREATED: ${{ github.event.issue.created_at }}
          AUTHOR: ${{ github.event.issue.user.login }}
          MODE: ${{ (github.event.issue.user.login == github.repository_owner && contains(github.event.issue.body, '<!-- formalia-edit v1 -->')) && 'web' || 'claim-form' }}
        run: scripts/edit_check.sh
      - uses: actions/upload-artifact@v4
        with:
          name: edit-check
          path: edit-out/message.md
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: steps.check.outputs.needs_proof == 'true'
        with:
          name: edit-result
          path: edit-out/result.json
          retention-days: 7

  proof-build:
    needs: check
    if: needs.check.outputs.ok == 'true' && needs.check.outputs.needs_proof == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 320
    permissions:
      contents: read
    outputs:
      ok: ${{ steps.build.outputs.ok }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: edit-result
          path: edit-out
      - id: build
        name: 编译提交的证明
        run: scripts/proof_build.sh
      - uses: actions/upload-artifact@v4
        if: steps.build.outputs.ok == 'true'
        with:
          name: proof-oleans
          path: proof-out/oleans.tar
          retention-days: 3
      - uses: actions/upload-artifact@v4
        if: steps.build.outputs.ok != 'true'
        with:
          name: proof-message
          path: proof-out/message.md
          retention-days: 7

  proof-check:
    needs: [check, proof-build]
    if: needs.proof-build.outputs.ok == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    outputs:
      ok: ${{ steps.verify.outputs.ok }}
      axioms: ${{ steps.verify.outputs.axioms }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: edit-result
          path: edit-out
      - uses: actions/download-artifact@v4
        with:
          name: proof-oleans
          path: proof-out
      - id: verify
        name: 在全新工作区里检查证明
        run: scripts/proof_check.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: proof-message
          path: proof-out/message.md
          retention-days: 7
          overwrite: true

  commit:
    needs: [check, proof-check]
    if: >-
      always() && needs.check.outputs.ok == 'true' &&
      (needs.check.outputs.needs_proof != 'true' || needs.proof-check.outputs.ok == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - id: apply
        name: 在最新 main 上重新应用并推送
        env:
          BODY: ${{ github.event.issue.body }}
          ISSUE: ${{ github.event.issue.number }}
          CREATED: ${{ github.event.issue.created_at }}
          AUTHOR: ${{ github.event.issue.user.login }}
          MODE: ${{ (github.event.issue.user.login == github.repository_owner && contains(github.event.issue.body, '<!-- formalia-edit v1 -->')) && 'web' || 'claim-form' }}
          EXPECT_TARGET: ${{ needs.check.outputs.target }}
          NEEDS_PROOF: ${{ needs.check.outputs.needs_proof }}
          AXIOMS: ${{ needs.proof-check.outputs.axioms }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          git config user.name "formalia-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          args=(--issue "$ISSUE" --created-at "$CREATED" --result /tmp/result.json)
          [ "$MODE" = "claim-form" ] && args+=(--claim-form --author "$AUTHOR")
          if [ "$NEEDS_PROOF" = "true" ]; then
            verified=$(python3 - <<'PY'
          import datetime, json, os, re
          ax = [a for a in os.environ.get("AXIOMS", "").split(",") if a]
          assert all(a in ("propext", "Classical.choice", "Quot.sound") for a in ax), ax
          tc = open("lean-toolchain").read().strip().split(":")[-1]
          print(json.dumps({"status": "passed", "lean": tc, "mathlib": "v4.29.0", "axioms": ax,
                            "checked_at": datetime.date.today().isoformat(), "run": os.environ["RUN_URL"]}, ensure_ascii=False))
          PY
            )
            args+=(--verified "$verified")
          fi
          for attempt in 1 2 3 4 5; do
            git fetch -q origin main && git reset -q --hard origin/main
            printf '%s' "$BODY" | python3 scripts/apply_edit.py "${args[@]}"
            python3 scripts/validate_meta.py
            # 新增表述在并发时编号可能顺延，内容不变；其他编辑的目标必须和检查时一致
            python3 - <<'PY'
          import json, os, sys
          r = json.load(open("/tmp/result.json"))
          if r["kind"] not in ("statement", "essay") and r["target"] != os.environ["EXPECT_TARGET"]:
              sys.exit(f"目标从 {os.environ['EXPECT_TARGET']} 变成了 {r['target']}，需要重新提交")
          open("/tmp/commit_msg.txt", "w").write(r["commit_message"])
          open("/tmp/changed.txt", "w").write("\n".join(r["changed"]) + "\n")
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"kind={r['kind']}\ntarget={r['target']}\n")
          PY
            xargs -d '\n' git add -- < /tmp/changed.txt
            git commit -q -F /tmp/commit_msg.txt
            if git push -q origin HEAD:main; then exit 0; fi
            echo "推送冲突，第 ${attempt} 次重试"; sleep $((attempt * 3))
          done
          exit 1
      - name: 回复并关闭议题
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
          TARGET: ${{ steps.apply.outputs.target }}
        run: |
          sha=$(git rev-parse --short HEAD)
          case "$TARGET" in [0-9]*) label="表述 #${TARGET}";; J*) label="解读 ${TARGET}";; *) label="猜想 ${TARGET}";; esac
          { echo "<!-- formalia-bot -->"
            echo "### 已写入"
            echo
            echo "${label}，提交 ${sha}。网站几分钟后更新。"
            echo
            echo "如果这条编辑有问题，任何人都可以再提交一条编辑把它改回来；维护者也可以直接回退这个提交。"
          } > /tmp/reply.md
          gh label create edit-applied --color 2da44e --description "网页编辑已写入" 2>/dev/null || true
          gh issue comment "$ISSUE" --body-file /tmp/reply.md
          gh issue edit "$ISSUE" --add-label edit-applied
          gh issue close "$ISSUE" --reason completed
      - name: 触发 CI、网站和导读
        env:
          GH_TOKEN: ${{ github.token }}
          KIND: ${{ steps.apply.outputs.kind }}
        run: |
          # 用 GITHUB_TOKEN 推送不会自动触发其他工作流，这里显式触发
          gh workflow run ci.yml --ref main
          gh workflow run pages.yml --ref main
          if [ "$KIND" = "statement" ]; then gh workflow run guides.yml --ref main; fi

  report:
    needs: [check, proof-build, proof-check, commit]
    if: >-
      always() && needs.check.result != 'skipped' &&
      (needs.check.outputs.ok != 'true' || needs.commit.result == 'failure' ||
       (needs.check.outputs.needs_proof == 'true' && needs.proof-check.outputs.ok != 'true'))
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: edit-check
        continue-on-error: true
      - uses: actions/download-artifact@v4
        if: needs.check.outputs.needs_proof == 'true'
        with:
          name: proof-message
          path: proof
        continue-on-error: true
      - name: 回复并关闭议题
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ISSUE: ${{ github.event.issue.number }}
          CHECK_OK: ${{ needs.check.outputs.ok }}
          PROOF_OK: ${{ needs.proof-check.outputs.ok }}
          NEEDS_PROOF: ${{ needs.check.outputs.needs_proof }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          { echo "<!-- formalia-bot -->"
            if [ "$CHECK_OK" = "true" ] && [ "$NEEDS_PROOF" = "true" ] && [ "$PROOF_OK" != "true" ]; then
              if [ -f proof/message.md ]; then cat proof/message.md
              else echo "### 证明没有通过"; echo; echo "验证过程出错或超时。"; fi
            elif [ "$CHECK_OK" = "true" ]; then
              echo "### 写入时出错"; echo
              echo "检查已经通过，但写入仓库时失败，可能是同时有别的修改。请重新提交一次；如果反复出现，维护者会处理。"
            elif [ -f message.md ]; then cat message.md
            else echo "### 没有通过检查"; echo; echo "检查过程出错。"; fi
            echo; echo "这条编辑没有写入。修改后可以重新提交。"
            echo; echo "运行记录：${RUN_URL}"
          } > reply.md
          gh label create edit-rejected --repo "$REPO" --color d1242f --description "网页编辑未通过" 2>/dev/null || true
          gh issue comment "$ISSUE" --repo "$REPO" --body-file reply.md
          gh issue edit "$ISSUE" --repo "$REPO" --add-label edit-rejected
          gh issue close "$ISSUE" --repo "$REPO" --reason "not planned"
