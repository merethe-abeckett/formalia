name: 声明证明了某条表述
description: 记录“某人/某模型声称证明了 #编号”。登记库只记录声明，不认证。
title: "[claim] 表述 #"
labels: ["claim"]
body:
  - type: markdown
    attributes:
      value: |
        填好后提交，机器人会自动检查并直接写进对应表述的元数据，几分钟后网站上就会显示。结果会回复在议题里。没有 GitHub 账号也可以在网站上直接提交。
        登记库只记录“谁声称证明了哪个编号”，不托管证明，也不判断证明是否正确。
  - type: input
    id: statement
    attributes:
      label: 表述编号
      description: 形如 20261014-01，不带井号
      placeholder: "20261014-01"
    validations:
      required: true
  - type: input
    id: claimant
    attributes:
      label: 声称方
      description: 人名、机构名或模型名
      placeholder: "例如：OpenAI / 张三 / DeepSeek-Prover"
    validations:
      required: true
  - type: input
    id: date
    attributes:
      label: 声称日期
      placeholder: "YYYY-MM-DD"
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: 证明链接
      description: 指向证明代码所在处（仓库、提交、论文附录）。登记库不托管证明。
      placeholder: "https://"
    validations:
      required: true
  - type: textarea
    id: note
    attributes:
      label: 备注（可选，只写事实）
      description: 例如使用的 Lean 和 Mathlib 版本、是否已被第三方独立验证及链接。可以用普通话或家乡话写。
