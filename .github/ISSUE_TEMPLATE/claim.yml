name: 声明证明或证否了某条表述
description: 登记“某人/某模型证明（或证否）了 #编号”。证明会被自动编译检查，通不过不登记。
title: "[claim] 表述 #"
labels: ["claim"]
body:
  - type: markdown
    attributes:
      value: |
        填好后提交，机器人会拉下你的证明，用 Lean 4.29.0 和 Mathlib v4.29.0 编译，检查定理的类型正好是这条表述（证否时正好是它的否命题）、没有 sorry、只用标准公理。全部通过才会登记，结果会回复在议题里。没有 GitHub 账号也可以在网站上提交，还可以直接粘贴单个文件。
        证明要求：只依赖 Mathlib v4.29.0 和本登记库；用 `import Conjectures.<猜想>.S<编号>` 导入表述；证明写成 `theorem 定理名 : Registry.<猜想>.S<编号> := …`，证否写成 `theorem 定理名 : ¬ Registry.<猜想>.S<编号> := …`。可以用 native_decide，登记库会让内核重新计算，页面上会标出感叹号。详见网站“使用说明”。
  - type: dropdown
    id: direction
    attributes:
      label: 方向
      options:
        - 证明（定理类型是这条表述）
        - 证否（定理类型是它的否命题 ¬）
    validations:
      required: true
  - type: input
    id: statement
    attributes:
      label: 表述编号
      description: 形如 20261014-01，不带井号
      placeholder: "20261014-01"
    validations:
      required: true
  - type: input
    id: claimant
    attributes:
      label: 声称方
      description: 人名、机构名或模型名。页面上会标为“自称”；以机构或模型名义声称时，请附上公告链接。
      placeholder: "例如：OpenAI / 张三 / DeepSeek-Prover"
    validations:
      required: true
  - type: input
    id: date
    attributes:
      label: 声称日期
      description: 你自己填的日期，只作参考。先后以登记库收到的时间为准。
      placeholder: "YYYY-MM-DD"
    validations:
      required: true
  - type: input
    id: repo
    attributes:
      label: 证明仓库
      description: 公开的 GitHub 仓库
      placeholder: "https://github.com/用户名/仓库名"
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: 提交号
      description: 完整的 40 位 commit，不能是分支名。登记的是这个固定版本。
    validations:
      required: true
  - type: input
    id: module
    attributes:
      label: 证明所在模块
      description: 定理所在文件的模块名，例如 MyProof.Main（对应仓库里的 MyProof/Main.lean）。只会拉取 MyProof.lean 和 MyProof/ 目录下的 .lean 文件。
    validations:
      required: true
  - type: input
    id: theorem
    attributes:
      label: 定理名
      description: 完整的定理名，例如 MyProof.goldbach
    validations:
      required: true
  - type: input
    id: announcement
    attributes:
      label: 公告链接（可选）
      placeholder: "https://"
  - type: textarea
    id: note
    attributes:
      label: 备注（可选，只写事实）
      description: 例如使用的 Lean 和 Mathlib 版本、是否已被第三方独立验证及链接。可以用普通话或家乡话写。
