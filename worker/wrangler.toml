# 由 .github/workflows/deploy-worker.yml 部署；KV 编号和站点密钥在部署时从 GitHub 仓库变量填入。见 docs/WEB_EDIT.md
name = "formalia-edit"
main = "src/index.js"
compatibility_date = "2026-10-01"
workers_dev = false     # 不用 xxx.workers.dev 子域名，只挂在自己的域名上
preview_urls = false
routes = [
  { pattern = "formalnaturalist.co.nz/api/*", zone_name = "formalnaturalist.co.nz" },
  { pattern = "www.formalnaturalist.co.nz/api/*", zone_name = "formalnaturalist.co.nz" },
]

[vars]
REPO = "merethe-abeckett/formalia"
ALLOWED_ORIGINS = "https://formalnaturalist.co.nz,https://www.formalnaturalist.co.nz"
RATE_LIMIT_PER_HOUR = "6"
SUBMIT_PER_DAY = "200"   # 全站每天网页编辑次数上限（没有人机验证时防刷）
TURNSTILE_SITEKEY = ""   # 在后台填写
GEMINI_MODEL = ""        # 部署时从仓库变量 GEMINI_MODEL 填入；留空则用 gemini-3.8-flash
DEEPINFRA_MODEL = ""     # 部署时从仓库变量 DEEPINFRA_MODEL 填入；留空则用 Qwen/Qwen3.8-Flash
ASK_PER_HOUR = "20"      # 交互式导读：每个匿名编号每小时提问次数
ASK_PER_DAY = "300"      # 交互式导读：全站每天提问次数

[[kv_namespaces]]
binding = "FORMALIA_KV"
id = "ed74a50b108f486383c7812f4850f51e"   # KV 命名空间 formalia（不是机密）

[[durable_objects.bindings]]
name = "CHAT"
class_name = "ChatRoom"

[[durable_objects.bindings]]
name = "ASK"
class_name = "AskGate"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ChatRoom"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["AskGate"]

[placement]
mode = "smart"   # 让 Worker 跑在离 Gemini、DeepInfra 等后端近的机房，避开不受支持的地区

# 密钥在 Cloudflare 后台设置一次即可，重新部署不会丢：
# GITHUB_TOKEN、TURNSTILE_SECRET、ANON_SECRET、CHAT_ADMIN_TOKEN、GEMINI_API_KEY、DEEPINFRA_API_KEY
