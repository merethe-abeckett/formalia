# 用 wrangler 部署时的配置；也可以直接在 Cloudflare 后台粘贴 src/index.js，见 docs/WEB_EDIT.md
name = "formalia-edit"
main = "src/index.js"
compatibility_date = "2026-10-01"
routes = [
  { pattern = "formalnaturalist.co.nz/api/*", zone_name = "formalnaturalist.co.nz" },
  { pattern = "www.formalnaturalist.co.nz/api/*", zone_name = "formalnaturalist.co.nz" },
]

[vars]
REPO = "merethe-abeckett/formalia"
ALLOWED_ORIGINS = "https://formalnaturalist.co.nz,https://www.formalnaturalist.co.nz"
RATE_LIMIT_PER_HOUR = "6"
TURNSTILE_SITEKEY = ""   # 在后台填写

[[kv_namespaces]]
binding = "FORMALIA_KV"
id = ""                  # 在后台创建 KV 命名空间后填写

[[durable_objects.bindings]]
name = "CHAT"
class_name = "ChatRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ChatRoom"]

[placement]
mode = "smart"   # 让 Worker 跑在离 Gemini 等后端近的机房，避开不受支持的地区

# 密钥在 Cloudflare 后台设置一次即可，重新部署不会丢：
# GITHUB_TOKEN、TURNSTILE_SECRET、ANON_SECRET、CHAT_ADMIN_TOKEN、GEMINI_API_KEY
